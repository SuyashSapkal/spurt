name: Build and Release

# Only runs when you push a tag like v0.1.0, v1.2.3, etc.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # Needed to create GitHub Releases

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build binaries on all 3 platforms
  # ──────────────────────────────────────────────
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: spurt.exe
            zip_name: spurt-windows.zip
          - os: ubuntu-latest
            artifact_name: spurt
            zip_name: spurt-linux.zip
          - os: macos-latest
            artifact_name: spurt
            zip_name: spurt-macos.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build binary with PyInstaller
        run: pyinstaller --onefile --name spurt --paths . --collect-all textual spurt/cli/main.py

      - name: Copy LICENSE and README into dist
        run: |
          cp LICENSE dist/
          cp README.md dist/

      - name: Zip the binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          zip ${{ matrix.zip_name }} ${{ matrix.artifact_name }} LICENSE README.md

      - name: Zip the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\${{ matrix.artifact_name }},dist\LICENSE,dist\README.md -DestinationPath dist\${{ matrix.zip_name }}

      - name: Upload zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: dist/${{ matrix.zip_name }}

  # ──────────────────────────────────────────────
  # Job 2: Create GitHub Release with all binaries
  # ──────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true

  # ──────────────────────────────────────────────
  # Job 3: Update Homebrew tap formula
  # Runs in this same workflow (triggered by the tag push) so it does NOT
  # depend on a release:published event — a release created with the default
  # GITHUB_TOKEN cannot trigger a separate workflow. needs: release guarantees
  # the release assets exist before we download them.
  # ──────────────────────────────────────────────
  homebrew:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release assets and compute SHA256
        id: sha
        run: |
          curl -sL "https://github.com/SuyashSapkal/spurt/releases/download/${GITHUB_REF_NAME}/spurt-macos.zip" -o macos.zip
          curl -sL "https://github.com/SuyashSapkal/spurt/releases/download/${GITHUB_REF_NAME}/spurt-linux.zip" -o linux.zip

          echo "macos_sha=$(sha256sum macos.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_sha=$(sha256sum linux.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-spurt tap repo
        uses: actions/checkout@v4
        with:
          repository: SuyashSapkal/homebrew-spurt
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
          MACOS_SHA: ${{ steps.sha.outputs.macos_sha }}
          LINUX_SHA: ${{ steps.sha.outputs.linux_sha }}
        run: |
          cat > Formula/spurt.rb << 'FORMULA'
          class Spurt < Formula
            desc "Push-to-talk dictation powered by whisper.cpp"
            homepage "https://github.com/SuyashSapkal/spurt"
            version "PLACEHOLDER_VERSION"
            license "BSD-2-Clause"

            on_macos do
              url "https://github.com/SuyashSapkal/spurt/releases/download/PLACEHOLDER_TAG/spurt-macos.zip"
              sha256 "PLACEHOLDER_MACOS_SHA"
            end

            on_linux do
              url "https://github.com/SuyashSapkal/spurt/releases/download/PLACEHOLDER_TAG/spurt-linux.zip"
              sha256 "PLACEHOLDER_LINUX_SHA"
            end

            def install
              bin.install "spurt"
            end

            test do
              assert_match "spurt PLACEHOLDER_VERSION", shell_output("#{bin}/spurt --version")
            end
          end
          FORMULA

          sed -i "s/PLACEHOLDER_VERSION/${VERSION}/g" Formula/spurt.rb
          sed -i "s/PLACEHOLDER_TAG/${TAG}/g" Formula/spurt.rb
          sed -i "s/PLACEHOLDER_MACOS_SHA/${MACOS_SHA}/g" Formula/spurt.rb
          sed -i "s/PLACEHOLDER_LINUX_SHA/${LINUX_SHA}/g" Formula/spurt.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/spurt.rb
          git commit -m "Update spurt to ${{ steps.version.outputs.version }}"
          git push

  # ──────────────────────────────────────────────
  # Job 4 (DISABLED): Update Winget manifest
  # Intentionally left off for now. To enable later: uncomment this job,
  # add a WINGET_TOKEN secret, and make sure the release has a
  # spurt-windows.zip asset (release.yml already builds it).
  # ──────────────────────────────────────────────
